<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Warehouse body -->
  <rect x="18" y="48" width="64" height="36" rx="3" fill="white" fill-opacity="0.95"/>
  <!-- Roof / triangle -->
  <polygon points="12,50 50,20 88,50" fill="url(#roof)"/>
  <!-- Door -->
  <rect x="39" y="62" width="22" height="22" rx="2" fill="#0a0f1e"/>
  <!-- Door window top arc -->
  <path d="M39 70 Q50 60 61 70" fill="#00e5ff" fill-opacity="0.5"/>
  <!-- Left window -->
  <rect x="22" y="56" width="12" height="10" rx="1.5" fill="#0a0f1e" fill-opacity="0.7"/>
  <!-- Right window -->
  <rect x="66" y="56" width="12" height="10" rx="1.5" fill="#0a0f1e" fill-opacity="0.7"/>
  <!-- Globe circle under warehouse (world) -->
  <circle cx="50" cy="90" r="5" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="50" y1="85" x2="50" y2="95" stroke="white" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="45" y1="90" x2="55" y2="90" stroke="white" stroke-width="1" stroke-opacity="0.6"/>
</svg>
